name: 投稿转题库

# 有人在 Issue 表单里投稿题目时，自动把它变成一道题并开一个 PR
# 审核的人只需要点一下 merge

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.labels.*.name, '题目投稿')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 把 Issue 内容转成题目
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/issue_to_questions.py

      - name: 开一个 PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "投稿 #${{ github.event.issue.number }}：${{ github.event.issue.title }}"
          branch: submission/issue-${{ github.event.issue.number }}
          delete-branch: true
          title: "投稿 #${{ github.event.issue.number }}：${{ github.event.issue.title }}"
          body: |
            来自 #${{ github.event.issue.number }}

            自动生成的，审核一下，没问题就 merge。
            想改题目的话，直接在 files changed 里编辑 `data/questions.json` 再 merge。

      - name: 在 Issue 里回个话
        if: steps.pr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '收到，已自动生成 PR：${{ steps.pr.outputs.pull-request-url }}\n\n等维护者审核合并。'
            })
